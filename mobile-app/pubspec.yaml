name: aria_console_mobile
description: Aria Console — parent app for controlling linked phones, tablets,
  TVs and laptops. Screen time, app blocks, live location, remote commands,
  web filters, alerts and more. Built by Resolute Femi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase — auth, database and realtime (same backend as the web console)
  supabase_flutter: ^2.5.11

  # HTTP for the confirmation-free sign-up endpoint on the web console
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Persisted settings (theme mode, last selected device)
  shared_preferences: ^2.3.2

  # Date formatting
  intl: ^0.19.0

  # Live map without any API key — OpenStreetMap tiles
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Pairing-code QR
  qr_flutter: ^4.1.0

# app_links 6.4.x references `flutter.compileSdkVersion` in its Gradle
# file, which Flutter 3.24's plugin loader does not provide to library
# modules — pin 6.2.1 (hardcodes compileSdk 34). Only used for deep
# links, which this app does not rely on.
dependency_overrides:
  app_links: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
